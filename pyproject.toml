[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Xu Chaoqian", email = "chaoranxu@gmail.com"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  # WhisperX 3.3.x ships with pyannote.audio 3.3.x, which still calls
  # `torchaudio.AudioMetaData`. That symbol was removed in torchaudio 2.4,
  # so torch / torchaudio are pinned below 2.4 here.
  # transformers 5.x in turn requires torch >= 2.4, so it is also pinned
  # below 5.0. Bump all three pins together when upgrading WhisperX.
  "whisperx>=3.1.0,<3.4",
  "torch>=2.0.0,<2.4",
  "torchaudio>=2.0.0,<2.4",
  "transformers>=4.39,<5.0",
  "numpy<2",
  "ffmpeg-python",
  "tqdm",
]
description = "WhisperX-driven SRT subtitle generator with deterministic reference-script alignment"
keywords = ["whisperx", "whisper", "srt", "subtitles", "transcription", "video", "audio", "forced-alignment"]
license = {file = "LICENSE"}
name = "whisper-srt"
readme = "README.md"
requires-python = ">=3.11,<3.14"
version = "2.0.0"

[project.optional-dependencies]
llm = [
  "httpx[socks]>=0.25.0",  # socks extra so HTTPS_PROXY/ALL_PROXY=socks5://... works
  "python-dotenv>=1.0.0",
]
all = [
  "whisper-srt[llm]",
]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "flake8",
]

[project.scripts]
whisper-srt = "whisper_srt.processor:main"
whisper-srt-batch = "whisper_srt.batch:main"
whisper-srt-compare = "whisper_srt.compare:main"

[project.urls]
homepage = "https://github.com/xuchaoqian/whisper-srt"
issues = "https://github.com/xuchaoqian/whisper-srt/issues"
repository = "https://github.com/xuchaoqian/whisper-srt"

[tool.pytest.ini_options]
addopts = ["-v"]
log_cli = true
log_cli_level = "INFO"

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.hatch.build.targets.wheel]
packages = ["whisper_srt"]
